<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE CR Elections</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#fff;color:#000;padding:40px 20px;max-width:600px;margin:0 auto}
        h1{font-size:24px;font-weight:500;margin-bottom:8px}
        p{color:#666;font-size:14px;margin-bottom:40px}
        .btn{background:#000;color:#fff;border:none;padding:10px 20px;font-size:13px;cursor:pointer;margin-bottom:40px}
        .btn:hover{background:#333}
        h2{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px}
        .card{border:1px solid #eee;padding:20px;margin-bottom:12px;cursor:pointer}
        .card:hover{border-color:#000}
        .card.selected{background:#000;color:#fff}
        .card h3{font-size:16px;font-weight:500}
        .card span{font-size:12px;color:#999}
        .card.selected span{color:#ccc}
        .result{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
        .result span:first-child{width:30px;font-weight:500}
        .result span:nth-child(2){flex:1}
        .result span:last-child{color:#666}
        footer{margin-top:60px;font-size:12px;color:#999}
        footer a{color:#000}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
        .modal.show{display:flex}
        .modal>div{background:#fff;padding:40px;text-align:center;max-width:300px}
        .modal h3{margin-bottom:20px}
        .modal button{margin:10px}
    </style>
</head>
<body>
    <h1>CR Elections</h1>
    <p>EEE-A Batch'28</p>
    <button class="btn" id="loginBtn" onclick="login()">Login</button>

    <h2>Candidates</h2>
    <div id="candidates"></div>

    <button class="btn" id="voteBtn" style="display:none" onclick="vote()">Vote</button>

    <h2 style="margin-top:40px">Results</h2>
    <div id="results"><p style="color:#999">Pending</p></div>

    <footer>Made with ❤️ by <a href="https://github.com/JACKURUVI99">Harish Annavisamy</a></footer>

    <div class="modal" id="modal">
        <div>
            <h3 id="modalText">Confirm?</h3>
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="confirmVote()">Confirm</button>
        </div>
    </div>

    <script>
        const API='https://1s0kvr4eke.execute-api.ap-south-1.amazonaws.com';
        let user=JSON.parse(localStorage.getItem('voter')),selected=null,candidates=[];
        if(user)document.getElementById('loginBtn').textContent=user.name.split(' ')[0];

        function login(){
            if(user){localStorage.clear();location.reload();return}
            location.href='https://auth.delta.nitt.edu/authorize?'+new URLSearchParams({client_id:'sXdN9pQbJXm3JDN-',redirect_uri:'https://jackuruvi99.github.io/crelectionsfrontend/callback.html',response_type:'code',scope:'email openid profile user',grant_type:'authorization_code',state:Math.random().toString(36).slice(2)});
        }

        fetch(API+'/api/candidates').then(r=>r.json()).then(d=>{
            candidates=d||[];
            document.getElementById('candidates').innerHTML=candidates.length?candidates.map(c=>`<div class="card" data-id="${c.id}" onclick="select(${c.id})"><h3>${c.name}</h3><span>${c.roll_number}</span></div>`).join(''):'<p style="color:#999">None</p>';
        });

        fetch(API+'/api/results').then(r=>r.json()).then(d=>{
            if(d.candidates?.length){
                const t=d.candidates.reduce((s,c)=>s+c.vote_count,0);
                document.getElementById('results').innerHTML=d.candidates.map((c,i)=>`<div class="result"><span>${i+1}</span><span>${c.name}</span><span>${t?(c.vote_count/t*100).toFixed(0):0}%</span></div>`).join('');
            }
        }).catch(()=>{});

        function select(id){
            if(!user){login();return}
            if(!user.roll_number?.startsWith('107124')||parseInt(user.roll_number.slice(-1))%2===0){alert("Only EEE-A Batch'28 allowed");return}
            if(user.has_voted){alert('Already voted');return}
            selected=candidates.find(c=>c.id===id);
            document.querySelectorAll('.card').forEach(e=>e.classList.remove('selected'));
            document.querySelector(`[data-id="${id}"]`).classList.add('selected');
            document.getElementById('voteBtn').style.display='block';
        }

        function vote(){document.getElementById('modalText').textContent='Vote for '+selected.name+'?';document.getElementById('modal').classList.add('show')}
        function closeModal(){document.getElementById('modal').classList.remove('show')}
        async function confirmVote(){
            closeModal();
            const r=await fetch(API+'/api/vote',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify({candidate_id:selected.id})});
            if(r.ok){user.has_voted=true;localStorage.setItem('voter',JSON.stringify(user));alert('Done!');location.reload()}else alert((await r.json()).error||'Failed');
        }
    </script>
</body>
</html>
