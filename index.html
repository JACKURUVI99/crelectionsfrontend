<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Elections</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background: #000;
            color: #f5f5f7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .page { max-width: 500px; margin: 0 auto; padding: 20px; }

        .login-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .login-screen h1 { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
        .login-screen .btn { margin-top: 40px; padding: 16px 48px; font-size: 17px; }
        .login-footer { position: absolute; bottom: 32px; font-size: 12px; color: #86868b; }
        .login-footer a { color: #0a84ff; text-decoration: none; }

        .app { display: none; }
        .app.show { display: block; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin-bottom: 24px;
        }
        .logo { font-size: 18px; font-weight: 600; }
        .btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:hover { background: #0070e0; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .title { font-size: 32px; font-weight: 700; text-align: center; margin-bottom: 32px; }

        .section {
            background: #1c1c1e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .cards { display: flex; flex-direction: column; gap: 8px; }
        .card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #2c2c2e;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .card:hover { background: #3a3a3c; }
        .card.selected { border-color: #0a84ff; background: #1c3a5e; }

        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5e5ce6, #bf5af2);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px; font-weight: 600;
        }
        .info { flex: 1; }
        .name { font-size: 15px; font-weight: 600; }
        .roll { font-size: 11px; color: #86868b; margin-top: 1px; }

        .radio { width: 20px; height: 20px; border: 2px solid #48484a; border-radius: 50%; position: relative; }
        .card.selected .radio { background: #0a84ff; border-color: #0a84ff; }
        .card.selected .radio::after {
            content: ""; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: #fff; border-radius: 50%;
        }

        .vote-btn {
            width: 100%; padding: 14px;
            background: #0a84ff; color: #fff; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 16px;
        }
        .vote-btn:disabled { background: #48484a; cursor: not-allowed; }

        .empty { text-align: center; padding: 20px; color: #86868b; font-size: 14px; }

        .result-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #2c2c2e; }
        .result-row:last-child { border: none; }
        .rank {
            width: 24px; height: 24px; background: #2c2c2e; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; color: #86868b; margin-right: 10px;
        }
        .result-row:first-child .rank { background: #ffd60a; color: #000; }
        .result-name { flex: 1; font-size: 14px; font-weight: 500; }
        .pct { font-size: 14px; font-weight: 600; }

        .voter-list { max-height: 180px; overflow-y: auto; }
        .voter-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #2c2c2e; font-size: 13px;
        }
        .voter-row:last-child { border: none; }
        .status { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
        .status.voted { background: #30d158; color: #000; }
        .status.pending { background: #ff9f0a; color: #000; }

        footer { text-align: center; padding: 24px 0; font-size: 11px; color: #86868b; }
        footer a { color: #0a84ff; text-decoration: none; }

        .modal-bg {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            align-items: center; justify-content: center; z-index: 100;
        }
        .modal-bg.show { display: flex; }
        .modal { background: #1c1c1e; border-radius: 16px; padding: 24px; width: 300px; text-align: center; }
        .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .modal p { font-size: 13px; color: #86868b; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 8px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
        .btn-cancel { background: #2c2c2e; color: #f5f5f7; }
        .btn-confirm { background: #0a84ff; color: #fff; }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <h1>SEM 6<br>CR Elections</h1>
        <button class="btn" onclick="login()">Sign In</button>
        <div class="login-footer">Made with love by <a href="https://github.com/JACKURUVI99">Harish Annavisamy</a></div>
    </div>

    <div class="app" id="app">
        <div class="page">
            <header>
                <div class="logo">CR Elections</div>
                <button class="btn btn-sm" onclick="logout()">Sign Out</button>
            </header>

            <h2 class="title">SEM 6</h2>

            <div class="section">
                <div class="section-title">Candidates</div>
                <div class="cards" id="candidatesGrid"><p class="empty">Loading...</p></div>
                <button class="vote-btn" id="voteBtn" onclick="submitVote()" disabled>Select a candidate</button>
            </div>

            <div class="section">
                <div class="section-title">Results</div>
                <div id="resultsList"><p class="empty">Pending</p></div>
            </div>

            <div class="section">
                <div class="section-title">Voters</div>
                <div class="voter-list" id="votersList"><p class="empty">Loading...</p></div>
            </div>

            <footer>Made with love by <a href="https://github.com/JACKURUVI99">Harish Annavisamy</a></footer>
        </div>
    </div>

    <div class="modal-bg" id="modal">
        <div class="modal">
            <h3>Confirm Vote</h3>
            <p id="modalText">Vote for this candidate?</p>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmVote()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://1s0kvr4eke.execute-api.ap-south-1.amazonaws.com';
        let user = JSON.parse(localStorage.getItem('voter')), selected = null, candidates = [];

        if (user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').classList.add('show');
            loadData();
        }

        function login() {
            location.href = 'https://auth.delta.nitt.edu/authorize?' + new URLSearchParams({
                client_id: 'sXdN9pQbJXm3JDN-',
                redirect_uri: 'https://jackuruvi99.github.io/crelectionsfrontend/callback.html',
                response_type: 'code', scope: 'email openid profile user',
                grant_type: 'authorization_code', state: Math.random().toString(36).slice(2)
            });
        }

        function logout() { localStorage.clear(); location.reload(); }

        function loadData() {
            fetch(API + '/api/candidates').then(r => r.json()).then(d => {
                candidates = d || [];
                const grid = document.getElementById('candidatesGrid');
                if (!candidates.length) { grid.innerHTML = '<p class="empty">No candidates</p>'; return; }
                grid.innerHTML = candidates.map(c => `
                    <div class="card" data-id="${c.id}" onclick="selectCard(${c.id})">
                        <div class="avatar">${c.name.charAt(0)}</div>
                        <div class="info"><div class="name">${c.name}</div><div class="roll">${c.roll_number}</div></div>
                        <div class="radio"></div>
                    </div>`).join('');
            }).catch(() => { document.getElementById('candidatesGrid').innerHTML = '<p class="empty">No candidates</p>'; });

            fetch(API + '/api/results').then(r => r.json()).then(d => {
                if (d.candidates?.length) {
                    const total = d.candidates.reduce((s, c) => s + c.vote_count, 0);
                    document.getElementById('resultsList').innerHTML = d.candidates.map((c, i) => {
                        const pct = total ? (c.vote_count / total * 100).toFixed(0) : 0;
                        return `<div class="result-row"><div class="rank">${i+1}</div><div class="result-name">${c.name}</div><div class="pct">${pct}%</div></div>`;
                    }).join('');
                }
            }).catch(() => {});

            fetch(API + '/api/voters').then(r => r.json()).then(d => {
                const list = document.getElementById('votersList');
                if (!d?.length) { list.innerHTML = '<p class="empty">No voters</p>'; return; }
                list.innerHTML = d.map(v => `<div class="voter-row"><span>${v.name}</span><span class="status ${v.has_voted ? 'voted' : 'pending'}">${v.has_voted ? 'Voted' : 'Pending'}</span></div>`).join('');
            }).catch(() => { document.getElementById('votersList').innerHTML = '<p class="empty">No voters</p>'; });
        }

        function selectCard(id) {
            if (!user.roll_number?.startsWith('107124') || parseInt(user.roll_number.slice(-1)) % 2 === 0) { alert("Not eligible"); return; }
            if (user.has_voted) { alert('Already voted'); return; }
            selected = candidates.find(c => c.id === id);
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`[data-id="${id}"]`).classList.add('selected');
            document.getElementById('voteBtn').disabled = false;
            document.getElementById('voteBtn').textContent = 'Vote for ' + selected.name;
        }

        function submitVote() {
            if (!selected) return;
            document.getElementById('modalText').textContent = `Vote for ${selected.name}?`;
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() { document.getElementById('modal').classList.remove('show'); }

        async function confirmVote() {
            closeModal();
            const r = await fetch(API + '/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                body: JSON.stringify({ candidate_id: selected.id })
            });
            if (r.ok) { user.has_voted = true; localStorage.setItem('voter', JSON.stringify(user)); alert('Vote submitted!'); location.reload(); }
            else { alert((await r.json()).error || 'Failed'); }
        }
    </script>
</body>
</html>
