<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CR Elections</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #000; color: #f5f5f7;
            min-height: 100vh; padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .page { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        h1 { font-size: 24px; font-weight: 600; }
        .btn {
            background: #0a84ff; color: #fff; border: none;
            padding: 10px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 500; cursor: pointer;
        }
        .btn:hover { background: #0070e0; }
        .btn-red { background: #ff453a; }
        .btn-green { background: #30d158; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .section {
            background: #1c1c1e; border-radius: 16px;
            padding: 20px; margin-bottom: 20px;
        }
        .section-title {
            font-size: 13px; font-weight: 600; color: #86868b;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px;
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #86868b; margin-bottom: 6px; }
        input, textarea {
            width: 100%; padding: 12px;
            background: #2c2c2e; border: none; border-radius: 10px;
            color: #f5f5f7; font-size: 15px;
        }
        input:focus, textarea:focus { outline: 1px solid #0a84ff; }
        textarea { resize: vertical; min-height: 80px; }

        .list { display: flex; flex-direction: column; gap: 8px; }
        .item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background: #2c2c2e; border-radius: 10px;
        }
        .item-info { flex: 1; }
        .item-name { font-size: 15px; font-weight: 500; }
        .item-sub { font-size: 12px; color: #86868b; }
        .item-actions { display: flex; gap: 8px; }

        .toggle {
            display: flex; gap: 8px; margin-top: 12px;
        }
        .toggle button {
            flex: 1; padding: 12px;
            background: #2c2c2e; border: none; border-radius: 10px;
            color: #f5f5f7; font-size: 14px; font-weight: 500; cursor: pointer;
        }
        .toggle button.active { background: #0a84ff; }

        .status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .status.approved { background: #30d158; color: #000; }
        .status.pending { background: #ff9f0a; color: #000; }

        .empty { text-align: center; padding: 24px; color: #86868b; }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Admin Panel</h1>
            <a href="index.html" class="btn btn-sm">Back</a>
        </header>

        <div class="section">
            <div class="section-title">Add Candidate</div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="candName" placeholder="Full name">
            </div>
            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="candRoll" placeholder="e.g. 107124001">
            </div>
            <div class="form-group">
                <label>Manifesto (optional)</label>
                <textarea id="candManifesto" placeholder="Campaign promises..."></textarea>
            </div>
            <button class="btn" onclick="addCandidate()">Add Candidate</button>
        </div>

        <div class="section">
            <div class="section-title">Candidates</div>
            <div class="list" id="candidatesList"></div>
        </div>

        <div class="section">
            <div class="section-title">Election Settings</div>
            <div class="toggle">
                <button id="resultsOff" onclick="setResults(false)">Results Hidden</button>
                <button id="resultsOn" onclick="setResults(true)">Results Public</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Voters</div>
            <div class="list" id="votersList"></div>
        </div>
    </div>

    <script>
        const API = 'https://1s0kvr4eke.execute-api.ap-south-1.amazonaws.com';

        loadCandidates();
        loadVoters();

        async function addCandidate() {
            const name = document.getElementById('candName').value.trim();
            const roll = document.getElementById('candRoll').value.trim();
            const manifesto = document.getElementById('candManifesto').value.trim();
            if (!name || !roll) { alert('Name and roll required'); return; }
            
            const r = await fetch(API + '/api/admin/candidates', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, roll_number: roll, manifesto })
            });
            if (r.ok) {
                document.getElementById('candName').value = '';
                document.getElementById('candRoll').value = '';
                document.getElementById('candManifesto').value = '';
                loadCandidates();
                alert('Candidate added!');
            } else {
                alert((await r.json()).error || 'Failed');
            }
        }

        async function loadCandidates() {
            const r = await fetch(API + '/api/admin/candidates');
            const d = await r.json();
            const list = document.getElementById('candidatesList');
            if (!d?.length) { list.innerHTML = '<p class="empty">No candidates</p>'; return; }
            list.innerHTML = d.map(c => `
                <div class="item">
                    <div class="item-info">
                        <div class="item-name">${c.name}</div>
                        <div class="item-sub">${c.roll_number}</div>
                    </div>
                    <span class="status ${c.is_approved ? 'approved' : 'pending'}">${c.is_approved ? 'Approved' : 'Pending'}</span>
                    <div class="item-actions">
                        ${!c.is_approved ? `<button class="btn btn-sm btn-green" onclick="approveCandidate(${c.id})">Approve</button>` : ''}
                        <button class="btn btn-sm btn-red" onclick="deleteCandidate(${c.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function approveCandidate(id) {
            await fetch(API + `/api/admin/candidates/${id}/approve`, { method: 'POST' });
            loadCandidates();
        }

        async function deleteCandidate(id) {
            if (!confirm('Delete this candidate?')) return;
            await fetch(API + `/api/admin/candidates/${id}`, { method: 'DELETE' });
            loadCandidates();
        }

        async function loadVoters() {
            const r = await fetch(API + '/api/voters');
            const d = await r.json();
            const list = document.getElementById('votersList');
            if (!d?.length) { list.innerHTML = '<p class="empty">No voters</p>'; return; }
            list.innerHTML = d.map(v => `
                <div class="item">
                    <div class="item-info"><div class="item-name">${v.name || 'Unknown'}</div></div>
                    <span class="status ${v.has_voted ? 'approved' : 'pending'}">${v.has_voted ? 'Voted' : 'Pending'}</span>
                </div>
            `).join('');
        }

        async function setResults(released) {
            await fetch(API + '/api/admin/results', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ released })
            });
            document.getElementById('resultsOff').classList.toggle('active', !released);
            document.getElementById('resultsOn').classList.toggle('active', released);
            alert(released ? 'Results are now public' : 'Results hidden');
        }
    </script>
</body>
</html>
